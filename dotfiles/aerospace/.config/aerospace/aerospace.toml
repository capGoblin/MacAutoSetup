# Reference: https://nikitabobko.github.io/AeroSpace/guide
config-version = 2
start-at-login = true

# Launch JankyBorders on startup
after-startup-command = [
    'exec-and-forget borders active_color=0xffe2e2e3 inactive_color=0xff414550 width=5.0 style=round',
    'exec-and-forget open "swiftbar://refreshallplugins"'
]

# Refresh SwiftBar workspace indicator on every workspace switch
exec-on-workspace-change = [
    '/bin/bash', '-c',
    'open -g "swiftbar://refreshplugin?name=spaces"'
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focused window/monitor
on-focus-changed = ['move-mouse window-lazy-center']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# ─── Gaps ──────────────────────────────────────────────────────────────────────
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.right      = 8
outer.bottom     = 8
outer.top        = 8

# ─── Main mode ─────────────────────────────────────────────────────────────────
[mode.main.binding]
    # App launchers
    alt-enter = 'exec-and-forget open -n -a Ghostty'
    alt-t     = 'exec-and-forget open -n -a Ghostty'
    alt-e     = 'exec-and-forget open -n -a "Brave Browser"'
    alt-q     = 'close --quit-if-last-window'

    # Focus (vim hjkl — left/down/up/right)
    alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
    alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
    alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
    alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

    # Move windows
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Smart resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Layouts
    alt-f           = 'fullscreen'
    alt-shift-space = 'layout floating tiling'
    alt-slash       = 'layout tiles horizontal vertical'
    alt-comma       = 'layout accordion horizontal vertical'

    # Workspace navigation
    alt-tab       = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Workspaces:  1=Terminal  2=Browser  3=Code  4=Discord  5=General  6=Scratch  7-10=Extra
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 10'

    # Modes
    alt-shift-c         = 'reload-config'
    alt-r               = 'mode resize'
    alt-shift-semicolon = 'mode service'

# ─── Resize mode ───────────────────────────────────────────────────────────────
[mode.resize.binding]
    h     = 'resize width -50'
    j     = 'resize height +50'
    k     = 'resize height -50'
    l     = 'resize width +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    enter = 'mode main'
    esc   = 'mode main'

# ─── Service mode (tree ops, debug) ────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']
    f         = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    # Join windows into containers (replaces split commands)
    alt-shift-h = ['join-with left',  'mode main']
    alt-shift-j = ['join-with down',  'mode main']
    alt-shift-k = ['join-with up',    'mode main']
    alt-shift-l = ['join-with right', 'mode main']

